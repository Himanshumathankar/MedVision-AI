version: '3.9'

services:
  api:
    build: ../backend
    ports:
      - '8000:8000'
    env_file:
      - ../backend/.env.example
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medvision
      POSTGRES_PASSWORD: medvision
      POSTGRES_DB: medvision
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  postgres_data:
